<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineMatch</title>
<style>
  :root { --bg:#14181c; --panel:#1f252b; --line:#2c343c; --text:#e6e9ec; --muted:#8f9ba6; --accent:#00c030; --chip:#2a323a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding:28px 20px 8px; text-align:center; }
  h1 { margin:0; font-size:28px; letter-spacing:.5px; }
  h1 span { color:var(--accent); }
  header p { margin:6px 0 0; color:var(--muted); }
  .interview-link { display:inline-block; margin-top:10px; color:var(--accent); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:16px 20px 60px; }
  .search { position:relative; max-width:620px; margin:12px auto 0; }
  .search input { width:100%; padding:13px 16px; font-size:16px; color:var(--text); background:var(--panel);
                  border:1px solid var(--line); border-radius:10px; outline:none; }
  .search input:focus { border-color:var(--accent); }
  .suggestions { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--panel);
                 border:1px solid var(--line); border-radius:10px; overflow:hidden; z-index:10; display:none; }
  .suggestion { display:flex; gap:12px; align-items:center; padding:8px 12px; cursor:pointer; }
  .suggestion:hover, .suggestion.active { background:var(--chip); }
  .suggestion img { width:34px; height:51px; object-fit:cover; border-radius:3px; background:var(--chip); }
  .suggestion .meta { color:var(--muted); font-size:13px; }
  .liked { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 4px; min-height:34px; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:var(--chip); border-radius:999px; padding:6px 8px 6px 14px; }
  .chip button { border:0; background:#3a444d; color:var(--text); width:22px; height:22px; border-radius:50%; cursor:pointer; line-height:1; }
  .chip button:hover { background:#c0392b; }
  .hint { text-align:center; color:var(--muted); margin:8px 0 0; }
  .clear { display:block; margin:6px auto 0; background:none; border:0; color:var(--muted); cursor:pointer; text-decoration:underline; }
  h2 { margin:30px 0 14px; font-size:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(480px, 1fr)); gap:14px; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  .card { display:flex; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .poster { flex:0 0 100px; width:100px; height:150px; border-radius:6px; background:var(--chip); object-fit:cover; }
  .card h3 { margin:0; font-size:17px; }
  .card h3 small { color:var(--muted); font-weight:400; }
  .sub { color:var(--muted); font-size:13px; margin:2px 0 6px; }
  .score { display:inline-block; background:var(--accent); color:#04210b; font-weight:700; font-size:12px; padding:1px 8px; border-radius:999px; margin-right:6px; }
  .because { font-size:13px; margin:6px 0 4px; }
  .because b { color:var(--accent); font-weight:600; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { background:var(--chip); border-radius:5px; padding:1px 7px; font-size:12px; color:#c4ccd3; }
  .tag i { font-style:normal; color:var(--muted); margin-right:4px; }
  .desc { font-size:13px; color:var(--muted); margin-top:6px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .status { text-align:center; color:var(--muted); margin-top:30px; }
  .why { background:none; border:0; padding:0; margin-left:4px; color:var(--accent); cursor:pointer; font-size:12px; text-decoration:underline; }
  .panel { margin-top:8px; padding:10px 12px; background:#181d22; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .panel p { margin:0 0 8px; color:#c4ccd3; }
  .panel .note { color:var(--muted); font-size:12px; margin:8px 0 0; }
  .bar-row { display:grid; grid-template-columns:110px 1fr 44px; align-items:center; gap:8px; margin:3px 0; }
  .bar-row span:first-child { color:#c4ccd3; }
  .bar { height:8px; background:var(--chip); border-radius:4px; overflow:hidden; }
  .bar div { height:100%; background:var(--accent); }
  .bar-row .pts { text-align:right; color:var(--muted); }
  .per-liked { margin-top:8px; color:#c4ccd3; }
  .per-liked b { color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>Cine<span>Match</span></h1>
  <p>Add films you like for recommendations matched on film features and patterns in MovieLens ratings.</p>
  <a class="interview-link" href="/testinterview">Testinterview · registrér brugertest</a>
</header>
<main>
  <div class="search">
    <input id="query" type="search" placeholder="Search for a film you like…" autocomplete="off" autofocus>
    <div id="suggestions" class="suggestions"></div>
  </div>
  <div id="liked" class="liked"></div>
  <button id="clear" class="clear" hidden>Clear all</button>
  <p id="hint" class="hint">Add a few films you love. Two or three works best.</p>
  <h2 id="resultsTitle" hidden>Recommended for you</h2>
  <div id="results" class="grid"></div>
  <p id="status" class="status"></p>
</main>
<script>
const STORAGE_KEY = "cinematch-liked";
const $ = (id) => document.getElementById(id);
let liked = [];
try { liked = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { liked = []; }
let searchTimer = null, searchSeq = 0, recommendSeq = 0, active = -1, shown = [];

function filmLabel(film) { return film.year ? `${film.name} (${film.year})` : film.name; }
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function posterImg(film, className) {
  const img = el("img", className);
  img.src = `/poster/${film.id}`;
  img.alt = "";
  img.loading = "lazy";
  img.onerror = () => { img.style.visibility = "hidden"; };
  return img;
}

function renderLiked() {
  const box = $("liked");
  box.replaceChildren(...liked.map((film) => {
    const chip = el("span", "chip", filmLabel(film));
    const remove = el("button", "", "×");
    remove.title = "Remove";
    remove.onclick = () => { liked = liked.filter((f) => f.id !== film.id); save(); };
    chip.append(remove);
    return chip;
  }));
  $("clear").hidden = liked.length === 0;
  $("hint").hidden = liked.length > 0;
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(liked));
  renderLiked();
  recommend();
}

async function recommend() {
  const seq = ++recommendSeq;
  const grid = $("results");
  if (liked.length === 0) {
    grid.replaceChildren(); $("resultsTitle").hidden = true; $("status").textContent = ""; return;
  }
  $("status").textContent = "Finding similar films…";
  try {
    const response = await fetch("/api/recommend", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ liked: liked.map((f) => f.id), limit: 20 }),
    });
    if (!response.ok) throw new Error(response.statusText);
    const films = await response.json();
    if (seq !== recommendSeq) return;
    $("status").textContent = "";
    $("resultsTitle").hidden = false;
    grid.replaceChildren(...films.map(renderCard));
  } catch (error) {
    if (seq === recommendSeq) $("status").textContent = "Something went wrong. Is the server running?";
  }
}

function renderWhy(film) {
  const panel = el("div", "panel");
  panel.hidden = true;
  const percent = (value) => Math.round(value * 100);
  panel.append(el("p", "", `${percent(film.similarity)}% is a combined match based on film features and, when available, patterns in MovieLens ratings. Each bar shows how much one kind of signal contributes; this is a match score, not a probability.`));

  const shown = film.breakdown.slice(0, 6);
  const otherValue = film.breakdown.slice(6).reduce((sum, part) => sum + part.value, 0);
  if (otherValue >= 0.005) shown.push({ label: "Everything else", value: otherValue });
  shown.forEach((part) => {
    const row = el("div", "bar-row");
    const bar = el("div", "bar"); const fill = el("div");
    fill.style.width = `${Math.min(100, (part.value / film.similarity) * 100)}%`;
    bar.append(fill);
    row.append(el("span", "", part.label), bar, el("span", "pts", `${(part.value * 100).toFixed(1)}`));
    panel.append(row);
  });

  if (film.breakdown.some((part) => part.feature === "audience")) {
    panel.append(el("p", "note", "MovieLens rating patterns summarize crowd-level preferences from anonymous ratings; they do not represent a specific user's profile."));
  }

  if (film.per_liked.length > 1) {
    const list = el("div", "per-liked");
    list.append(document.createTextNode("Similarity to each film you liked: "));
    film.per_liked.forEach((item, index) => {
      if (index) list.append(document.createTextNode(" · "));
      list.append(el("b", "", item.name), document.createTextNode(` ${percent(item.similarity)}%`));
    });
    panel.append(list);
    panel.append(el("p", "note", `With several liked films, the match is half your average similarity across all of them and half your closest film (${film.because}), so one unusual pick does not drag down every result.`));
  }
  panel.append(el("p", "note", "Results are ranked by this match, with a very small bonus for highly rated and widely released films. That bonus is not included in the percentage."));
  return panel;
}

function renderCard(film) {
  const card = el("div", "card");
  card.append(posterImg(film, "poster"));
  const body = el("div");
  const title = el("h3", "", film.name);
  if (film.year) title.append(el("small", "", ` (${film.year})`));
  const panel = renderWhy(film);
  const sub = el("div", "sub");
  sub.append(el("span", "score", `${Math.round(film.similarity * 100)}% match`));
  const why = el("button", "why", "Why?");
  why.onclick = () => { panel.hidden = !panel.hidden; why.textContent = panel.hidden ? "Why?" : "Hide"; };
  sub.append(why, document.createTextNode("  " + [`★ ${film.rating.toFixed(1)}`, film.genres, film.director && `Dir. ${film.director}`].filter(Boolean).join(" · ")));
  const because = el("div", "because");
  because.append(document.createTextNode("Because you liked "), el("b", "", film.because));
  const tags = el("div", "tags");
  film.shared.forEach((group) => {
    const tag = el("span", "tag"); tag.append(el("i", "", group.label), document.createTextNode(group.values.join(", "))); tags.append(tag);
  });
  body.append(title, sub, panel, because, tags, el("div", "desc", film.description));
  card.append(body);
  return card;
}

function hideSuggestions() { $("suggestions").style.display = "none"; shown = []; active = -1; }

function renderSuggestions(films) {
  shown = films; active = -1;
  const box = $("suggestions");
  if (!films.length) { hideSuggestions(); return; }
  box.replaceChildren(...films.map((film) => {
    const row = el("div", "suggestion");
    row.append(posterImg(film, ""));
    const text = el("div");
    text.append(el("div", "", filmLabel(film)), el("div", "meta", [film.director && `Dir. ${film.director}`, film.genres].filter(Boolean).join(" · ")));
    row.append(text);
    row.onmousedown = (event) => { event.preventDefault(); add(film); };
    return row;
  }));
  box.style.display = "block";
}

function add(film) {
  if (!liked.some((f) => f.id === film.id)) liked.push({ id: film.id, name: film.name, year: film.year });
  $("query").value = ""; hideSuggestions(); save();
}

$("query").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const query = $("query").value.trim();
  if (!query) { hideSuggestions(); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    const films = await (await fetch(`/api/search?q=${encodeURIComponent(query)}`)).json();
    if (seq === searchSeq) renderSuggestions(films);
  }, 150);
});
$("query").addEventListener("keydown", (event) => {
  const rows = $("suggestions").children;
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    if (!shown.length) return;
    active = (active + (event.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length;
    [...rows].forEach((row, i) => row.classList.toggle("active", i === active));
  } else if (event.key === "Enter" && shown.length) {
    event.preventDefault(); add(shown[Math.max(active, 0)]);
  } else if (event.key === "Escape") { hideSuggestions(); }
});
$("query").addEventListener("blur", hideSuggestions);
$("clear").onclick = () => { liked = []; save(); };

renderLiked();
recommend();
</script>
</body>
</html>
